services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: inventory
    # max_connections is the hard ceiling the app's pool budget is sized against.
    command: ["postgres", "-c", "max_connections=100"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # redis-stack-server bundles the RediSearch module (FT.CREATE / FT.SEARCH).
    image: redis/redis-stack-server:7.4.0-v1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
